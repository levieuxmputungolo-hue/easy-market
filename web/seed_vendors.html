<!DOCTYPE html>
<html>
<head><title>Seed Stats</title></head>
<body>
<h2>Mise a jour des stats Firestore...</h2>
<div id="log"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDbxXExuSaGCYN7B1oA3e8WnlFvQRNgFME",
  authDomain: "easy-market-96c4a.firebaseapp.com",
  projectId: "easy-market-96c4a",
});
const db = firebase.firestore();
const log = document.getElementById('log');

async function updateStats() {
  try {
    await db.collection('stats').doc('counts').set({
      vendors: 7,
      users: 19,
      products: 50,
    }, { merge: true });
    log.innerHTML += '<p>✅ Stats mises a jour!</p>';
    const doc = await db.collection('stats').doc('counts').get();
    if (doc.exists) {
      const d = doc.data();
      log.innerHTML += '<p>📊 Vendeurs: ' + d.vendors + ' | Users: ' + d.users + ' | Produits: ' + d.products + '</p>';
    }
    log.innerHTML += '<h3>Recharge la page d\'accueil!</h3>';
  } catch(e) {
    log.innerHTML += '<p style="color:red">❌ Erreur: ' + e.message + '</p>';
  }
}
updateStats();
</script>
</body>
</html>
